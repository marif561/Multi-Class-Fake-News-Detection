  </defs>
  <rect width="960" height="280" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">CheckThat! 2022 Task 3 · train on English, test on English (3a) or German (3b)</text>

  <rect x="10" y="95" width="160" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
